# ==========================================
# APPLICATION
# ==========================================
spring.application.name=pragathi-sweets-backend
server.port=${SERVER_PORT:8080}

# ==========================================
# MYSQL DATABASE
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pragathi_sweets?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==========================================
# FILE UPLOAD
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ==========================================
# JWT
# Provide JWT_SECRET as an environment variable in production.
# The secret must be Base64-encoded and at least 256 bits for HS256.
# ==========================================
jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVm}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ==========================================
# RAZORPAY
# Set these via environment variables. Never commit real keys.
# ==========================================
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_TDnNEoRLz2m96G}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:25E7Iiv68Owji2k1dKm18quw}

# ==========================================
# EMAIL CONFIGURATION
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@pragathisweets.com}
app.mail.enabled=${MAIL_ENABLED:false}

# ==========================================
# CORS
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# ACTUATOR & HEALTH MONITORING
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.ems.pragathisweets=DEBUG

# ==========================================
# INVENTORY
# ==========================================
app.inventory.low-stock-threshold=${LOW_STOCK_THRESHOLD:10}

# ==========================================
# ADMIN BOOTSTRAP (creates a default admin user on first run if none exists)
# ==========================================
app.admin.default-email=${DEFAULT_ADMIN_EMAIL:admin@pragathisweets.com}
app.admin.default-password=${DEFAULT_ADMIN_PASSWORD:Admin@123}
app.admin.default-name=${DEFAULT_ADMIN_NAME:Super Admin}
